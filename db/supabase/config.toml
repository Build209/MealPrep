# Local database used only by CI and by developers to test against the live schema.
# This folder is separate from mobile/supabase on purpose: that folder deploys the live edge
# functions, and a config.toml there could change how they deploy.
project_id = "mealplanatic-rebuild-db"

[db]
port = 54322
shadow_port = 54320
# Live project runs PostgreSQL 17 (17.11 on 2026-10-13).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false
