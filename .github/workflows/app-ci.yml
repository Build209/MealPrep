name: New app (rebuild)

# Typecheck, unit tests and a web build for the rebuilt app in app/.
# The old app in mobile/ keeps its own workflow (ci.yml).
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [rebuild/v1]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No lockfile yet: the first one is produced by this job and uploaded below,
      # then committed in a follow-up so later runs can use `npm ci`.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Built without server settings; the phone preview build (later in phase 0) adds them.
      - name: Web build
        run: npm run export:web
      - name: Keep the generated lockfile
        if: always() && hashFiles('app/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-package-lock
          path: app/package-lock.json
          if-no-files-found: ignore
