name: New app phone pass

# Runs every end-to-end spec in app/e2e on two phone profiles (iPhone 15 and Pixel 7, Playwright
# device emulation) plus the phone screen tour (app/e2e/phone-tour.spec.ts): screenshots of every
# screen a browser can reach, with automatic checks (no sideways scroll, 44px tap targets, no
# clipped text, tomato only for camera or money). Same LOCAL Supabase stack as app-e2e.yml: never
# connects to the live project.
#
# Results: the "phone-screens" artifact on every run. On push to rebuild/v1 or main and on manual runs the
# same files are also stored on the `phone-screens` branch (one commit, force-updated, like
# app-preview.yml does for builds); on pull requests from this repository, on
# `phone-screens-pr-<number>`. The tests run with a read-only token; only the small publish job,
# which runs no code from the pull request, can push.
on:
  pull_request:
    paths:
      - "app/**"
      - "db/**"
      - ".github/workflows/app-phone.yml"
  push:
    branches: [rebuild/v1, main]
    paths:
      - "app/**"
      - "db/**"
      - ".github/workflows/app-phone.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          # Same pin as app-e2e.yml.
          version: 2.120.0

      - name: Start local Supabase (applies migrations)
        run: supabase start --workdir db

      # Same as app-e2e.yml: local URL and keys only, refused if not on this machine.
      - name: Read local URL and keys
        run: |
          supabase status -o env --workdir db > "$RUNNER_TEMP/supabase.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' || true; }
          url="$(get API_URL)"
          anon="$(get ANON_KEY)"; [ -n "$anon" ] || anon="$(get PUBLISHABLE_KEY)"
          service="$(get SERVICE_ROLE_KEY)"; [ -n "$service" ] || service="$(get SECRET_KEY)"
          if [ -z "$url" ] || [ -z "$anon" ] || [ -z "$service" ]; then
            echo "Could not read API_URL / anon key / service key from supabase status." >&2
            exit 1
          fi
          case "$url" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "API_URL is not local: refusing." >&2; exit 1 ;;
          esac
          mail="$(get MAILPIT_URL)"; [ -n "$mail" ] || mail="$(get INBUCKET_URL)"; [ -n "$mail" ] || mail="http://127.0.0.1:54324"
          case "$mail" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Mail catcher URL is not local: refusing." >&2; exit 1 ;;
          esac
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          {
            echo "E2E_SUPABASE_URL=$url"
            echo "E2E_SUPABASE_ANON_KEY=$anon"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "E2E_MAIL_URL=$mail"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase.env"
          echo "Local API: $url"

      - name: Install app dependencies
        working-directory: app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Chromium for Android (and the iPhone fallback). WebKit for the iPhone if it installs.
      - name: Install browsers for Playwright
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          if npx playwright install --with-deps webkit; then
            echo "PHONE_IPHONE_ENGINE=webkit" >> "$GITHUB_ENV"
            echo "iPhone profile: WebKit"
          else
            echo "PHONE_IPHONE_ENGINE=chromium" >> "$GITHUB_ENV"
            echo "::warning::WebKit did not install; the iPhone profile runs in Chromium (iPhone size, user agent and touch)."
          fi

      - name: Web build against the local stack
        working-directory: app
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL" \
          EXPO_PUBLIC_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY" \
          npm run export:web

      # Owner's call (2026-10-14): Android must pass; iPhone (WebKit) is report-only for now, because
      # Playwright's Linux WebKit crashes on one Grocery step that passes on Chromium. iPhone results
      # still run, appear in the report and the step summary, and are checked on a real iPhone.
      - name: Phone pass, iPhone (report-only)
        id: iphone
        continue-on-error: true
        working-directory: app
        env:
          PHONE_RUN: iphone
        run: npx playwright test -c playwright.phone.config.ts --project=iphone

      - name: Phone pass, Android (must pass)
        if: always()
        working-directory: app
        env:
          PHONE_RUN: android
        run: npx playwright test -c playwright.phone.config.ts --project=android

      - name: Note iPhone result
        if: always() && steps.iphone.outcome == 'failure'
        run: echo "::warning title=iPhone phone pass::iPhone (WebKit) tests failed; report-only for now. See the phone report and playwright-report-phone-iphone."

      - name: Write the phone report
        if: always()
        working-directory: app
        run: |
          node e2e/phone-report.mjs phone-screens
          if [ -f phone-screens/phone-report.md ]; then cat phone-screens/phone-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Auth server log (on failure)
        if: failure()
        run: docker logs --tail 200 supabase_auth_mealplanatic-rebuild-db || true

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screens
          path: app/phone-screens
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report and traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-phone
          path: |
            app/playwright-report-phone*
            app/test-results-phone*
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir db --no-backup

  # Stores the screenshots on a branch so they can be fetched with git. Runs no repository code:
  # it only downloads the artifact above and pushes it as a single commit.
  publish:
    needs: phone
    if: >-
      always() && (needs.phone.result == 'success' || needs.phone.result == 'failure') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        id: download
        # No artifact when the tests stopped before the first screenshot: nothing to store.
        continue-on-error: true
        with:
          name: phone-screens
          path: phone-screens
      - name: Store on the phone-screens branch
        if: steps.download.outcome == 'success'
        working-directory: phone-screens
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ needs.phone.result }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            branch="phone-screens-pr-${PR_NUMBER}"
          else
            branch="phone-screens"
          fi
          case "$branch" in phone-screens|phone-screens-pr-[0-9]*) ;; *) echo "Unexpected branch $branch" >&2; exit 1 ;; esac
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Phone pass screenshots of ${HEAD_SHA} (${GITHUB_REF_NAME}, tests: ${RESULT})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          echo "Stored on branch $branch"
