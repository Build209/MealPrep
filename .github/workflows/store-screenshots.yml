name: Google Play screenshots

# Google Play phone screenshots of the web build: app/e2e-store/store-screenshots.spec.ts with its
# own config (app/e2e-store/playwright.config.ts), 1080 x 1920 PNG each. Same LOCAL Supabase stack
# as app-e2e.yml and app-phone.yml: a demo account is seeded into it, edge functions are answered
# by Playwright (never the live functions), and nothing connects to the live project.
#
# Result: the "play-screenshots" artifact. Manual runs only, plus pull requests that change this
# workflow or the screenshot spec.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/store-screenshots.yml"
      - "app/e2e-store/**"

permissions:
  contents: read

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          # Same pin as app-e2e.yml.
          version: 2.120.0

      - name: Start local Supabase (applies migrations)
        run: supabase start --workdir db

      # Same as app-e2e.yml: local URL and keys only, refused if not on this machine.
      - name: Read local URL and keys
        run: |
          supabase status -o env --workdir db > "$RUNNER_TEMP/supabase.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' || true; }
          url="$(get API_URL)"
          anon="$(get ANON_KEY)"; [ -n "$anon" ] || anon="$(get PUBLISHABLE_KEY)"
          service="$(get SERVICE_ROLE_KEY)"; [ -n "$service" ] || service="$(get SECRET_KEY)"
          if [ -z "$url" ] || [ -z "$anon" ] || [ -z "$service" ]; then
            echo "Could not read API_URL / anon key / service key from supabase status." >&2
            exit 1
          fi
          case "$url" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "API_URL is not local: refusing." >&2; exit 1 ;;
          esac
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          {
            echo "E2E_SUPABASE_URL=$url"
            echo "E2E_SUPABASE_ANON_KEY=$anon"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase.env"
          echo "Local API: $url"

      - name: Install app dependencies
        working-directory: app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Chromium for Playwright
        working-directory: app
        run: npx playwright install --with-deps chromium

      # No EXPO_PUBLIC_APP_CHANNEL (no "Preview build" label) and no EXPO_PUBLIC_GIT_SHA (no build line).
      - name: Web build against the local stack
        working-directory: app
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL" \
          EXPO_PUBLIC_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY" \
          npm run export:web

      - name: Take the screenshots
        working-directory: app
        run: npx playwright test -c e2e-store/playwright.config.ts

      - name: List screenshot sizes
        if: always()
        working-directory: app
        run: |
          if [ -d play-screenshots ]; then
            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, struct
          print("| File | Pixels | Bytes |\n|---|---|---|")
          for name in sorted(os.listdir("play-screenshots")):
              path = os.path.join("play-screenshots", name)
              with open(path, "rb") as f:
                  head = f.read(24)
              w, h = struct.unpack(">II", head[16:24])
              print(f"| {name} | {w} x {h} | {os.path.getsize(path)} |")
          PY
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-screenshots
          path: app/play-screenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright report and traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-store
          path: |
            app/playwright-report-store
            app/test-results-store
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir db --no-backup
