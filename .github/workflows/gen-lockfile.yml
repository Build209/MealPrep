name: TEMP generate app lockfile

# Temporary: generates app/package-lock.json once and commits it to this branch.
# Deleted again in the next commit on the branch. Never runs anywhere else.
on:
  push:
    branches: [rebuild/app-lockfile]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/app-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile (only if missing)
        id: gen
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile already exists; nothing to do."
            echo "made=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --version
          npm --version
          npm install --package-lock-only --no-audit --no-fund
          echo "made=1" >> "$GITHUB_OUTPUT"
      - name: Commit lockfile
        if: steps.gen.outputs.made == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "app: add package-lock.json (generated by CI, npm install --package-lock-only, Node 22)"
          git push origin HEAD:rebuild/app-lockfile
