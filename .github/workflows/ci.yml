name: CI checks

# Runs on every PR and push so broken code is caught before the Pages deploy.
# The old app's `mobile` job went with mobile/ at the switch-over. The new app, the edge functions
# and the database have their own workflows: app-ci.yml, app-e2e.yml, functions-ci.yml, db-baseline.yml,
# site-build.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The 209 Meal Prep static site in New/ (served at /209/).
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static site tests
        run: |
          node lab.test.js
          node shopping.test.js

  # Wikibooks recipe loader (db/scripts/wikibooks): parser and SQL-builder tests. No network, no database.
  wikibooks-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parser tests
        run: python3 -m unittest discover -s db/scripts/wikibooks -p 'test_*.py'
      - name: Loader tests
        run: node --test db/scripts/wikibooks/load.test.mjs
      - name: Loader dry run
        run: node db/scripts/wikibooks/load.mjs --dry-run > /dev/null
